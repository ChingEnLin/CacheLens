[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-lens"
version = "1.0.0"
description = "Non-invasive prompt cache instrumentation for LLM API apps"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cache-lens contributors" }]
keywords = ["llm", "prompt-caching", "anthropic", "gemini", "observability", "otel"]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.8"]
openai = ["openai>=1.40"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
all = [
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "openai>=1.40",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
dev = ["pytest>=7.0"]

[project.scripts]
cache-lens = "cache_lens.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/cache-lens"

[tool.hatch.build.targets.wheel]
packages = ["cache_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
