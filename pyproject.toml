[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachelens"
version = "1.1.0"
description = "Non-invasive prompt cache instrumentation for LLM API apps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ching En Lin", email = "chingenlin71@gmail.com" }]
keywords = ["llm", "prompt-caching", "anthropic", "gemini", "observability", "otel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.8"]
openai = ["openai>=1.40"]
# opentelemetry >=1.23 is required for synchronous Gauge (Meter.create_gauge).
otel = [
    "opentelemetry-sdk>=1.23",
    "opentelemetry-exporter-otlp-proto-grpc>=1.23",
]
all = [
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "openai>=1.40",
    "opentelemetry-sdk>=1.23",
    "opentelemetry-exporter-otlp-proto-grpc>=1.23",
]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
cache-lens = "cache_lens.cli:main"

[project.urls]
Homepage = "https://github.com/ChingEnLin/CacheLens"
Repository = "https://github.com/ChingEnLin/CacheLens"
Issues = "https://github.com/ChingEnLin/CacheLens/issues"



[tool.hatch.build.targets.wheel]
packages = ["cache_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
major_on_zero = false

# Push with the checked-out SSH remote (deploy key) instead of rewriting the
# push URL with the API token — the main ruleset only exempts deploy keys.
[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
# "update" inserts new versions at the insertion flag instead of regenerating
# the whole file — earlier hand-written sections are preserved verbatim.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
