[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachelens"
version = "1.0.2"
description = "Non-invasive prompt cache instrumentation for LLM API apps"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ching En Lin", email = "chingenlin71@gmail.com" }]
keywords = ["llm", "prompt-caching", "anthropic", "gemini", "observability", "otel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.8"]
openai = ["openai>=1.40"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
all = [
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "openai>=1.40",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
dev = ["pytest>=7.0"]

[project.scripts]
cache-lens = "cache_lens.cli:main"

[project.urls]
Homepage = "https://github.com/ChingEnLin/CacheLens"
Repository = "https://github.com/ChingEnLin/CacheLens"
Issues = "https://github.com/ChingEnLin/CacheLens/issues"



[tool.hatch.build.targets.wheel]
packages = ["cache_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_parser = "conventional"
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
