name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Gate publishing on a green test matrix — a release must never ship from a
  # commit whose tests fail.
  test:
    runs-on: ubuntu-latest
    if: github.repository == 'ChingEnLin/CacheLens'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev,all]

      - name: Run tests
        run: pytest

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.repository == 'ChingEnLin/CacheLens'
    environment: pypi
    permissions:
      contents: write
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Push the version-bump commit over SSH with the release deploy key:
          # the main ruleset requires PRs but exempts deploy keys, so the bot
          # can release while humans still go through pull requests.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Run the PSR CLI on the runner instead of the docker action: the action
      # container can't reach checkout's SSH key file, and PSR must push via
      # the deploy-key SSH remote (remote.ignore_token_for_push in pyproject)
      # to clear the main ruleset. GH_TOKEN is still used for the GitHub
      # Release API, which the ruleset doesn't gate.
      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install "python-semantic-release>=9.12,<10"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          semantic-release -v version
          after=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        if: steps.release.outputs.released == 'true'
        run: pip install build && python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          verbose: true
