name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Gate publishing on a green test matrix — a release must never ship from a
  # commit whose tests fail.
  test:
    runs-on: ubuntu-latest
    if: github.repository == 'ChingEnLin/CacheLens'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev,all]

      - name: Run tests
        run: pytest

  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.repository == 'ChingEnLin/CacheLens'
    environment: pypi
    permissions:
      contents: write
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Push the version-bump commit over SSH with the release deploy key:
          # the main ruleset requires PRs but exempts deploy keys, so the bot
          # can release while humans still go through pull requests.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@0dc72ac9058a62054a45f6344c83a423d7f906a8 # v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.release.outputs.released == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        if: steps.release.outputs.released == 'true'
        run: pip install build && python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          verbose: true
