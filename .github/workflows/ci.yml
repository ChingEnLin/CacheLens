name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev,all]

      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Ruff
        run: ruff check cache_lens tests

      - name: Mypy
        run: mypy cache_lens

  # Install every extra at its declared *minimum* version so floor drift
  # (e.g. an API the SDK only gained later) fails CI instead of users.
  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install minimum declared versions
        run: |
          pip install -e .[dev]
          pip install "rich==13.0.0" \
            "opentelemetry-sdk==1.23.0" \
            "opentelemetry-exporter-otlp-proto-grpc==1.23.0"

      - name: Run tests
        run: pytest
